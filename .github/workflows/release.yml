name: release

on:
  workflow_dispatch:
    inputs:
      latest:
        description: "Release as latest?"
        required: true
        type: boolean
      tag:
        description: "Override tag? (vM.N.P)"
        required: false

jobs:
  info:
    name: Information
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: "Determine tag"
        id: tag
        run: echo "value=${{ inputs.tag == '' && 'v$(cat version/VERSION)' || inputs.tag }}" | tee -a "${GITHUB_OUTPUT}"

      # NOTE: Historically, we have not been great about running the beta workflow on the main branch.
      # This has implications on how we run cosign.
      # Practically, this means that certain tools like tenv and tofudl don't install betas correctly.
      # We should pick one (main vs branch) and stick to it here.
      - name: "Determine Prerelease Status"
        id: prerelease
        run: echo "value=$(echo "${{ steps.tag.outputs.value }}" | grep ".*[^v\.0-9].*" | wc -l)" | tee -a "${GITHUB_OUTPUT}"

      - name: "Ensure tag matches branch"
        if: ${{ !startsWith(steps.tag.outputs.value, github.ref_name) }}
        run: echo "Version tag ${{ steps.tag.outputs.value }} does not match branch ${{ github.ref_name }}!" && exit 1

      - name: "Ensure prerelease is not latest"
        if: ${{ inputs.latest && steps.prerelease.outputs.value == 1 }}
        run: echo "Latest and Prerelease conflict" && exit 1

      - name: "Summary"
        run: |
          echo "Branch: ${{ github.ref_name }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "Tag: ${{ steps.tag.outputs.value }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "Latest: ${{ inputs.latest }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "Prerelease: ${{ steps.prerelease.outputs.value }}" | tee -a "${GITHUB_STEP_SUMMARY}"
    outputs:
      branch: ${{ github.ref_name }}
      tag: ${{ steps.tag.outputs.value }}
      latest: ${{ inputs.latest }}
      prerelease: ${{ steps.prerelease.outputs.value == 1 }}

  build:
    needs: [info]
    strategy:
      fail-fast: false
      matrix:
        include: # NOTE: Ensure this list EXACTLY matches the cache logic below AND the GoReleaser config.
          - {goos: "linux", goarch: "amd64", runson: "ubuntu-latest"}
          - {goos: "linux", goarch: "arm64", runson: "ubuntu-latest"}
          - {goos: "freebsd", goarch: "amd64", runson: "ubuntu-latest"}
          - {goos: "openbsd", goarch: "amd64", runson: "ubuntu-latest"}
          - {goos: "solaris", goarch: "amd64", runson: "ubuntu-latest"}
          - {goos: "darwin", goarch: "amd64", runson: "macos-latest"}
          - {goos: "darwin", goarch: "arm64", runson: "macos-latest"}
          - {goos: "windows", goarch: "amd64", runson: "windows-latest"}
          - {goos: "windows", goarch: "arm64", runson: "windows-latest"}
    
    name: Build for ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ubuntu-latest
    environment: gpg
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: "Fetch source code ${{ needs.info.outputs.tag }}"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.info.outputs.tag }}

      - name: "Configure Go toolchain"
        uses: ./.github/actions/go-toolchain

      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "${{ matrix.goos }}", goarch: "${{ matrix.goarch }}", tag: "${{ needs.info.outputs.tag }}" }

      - name: Setup snapcraft
        run: |
          sudo snap install snapcraft --classic --channel=7.x/stable

          # See https://github.com/goreleaser/goreleaser/issues/1715
          # https://bugs.launchpad.net/snapcraft/+bug/1889741
          mkdir -p "$HOME/.cache/snapcraft/download"
          mkdir -p "$HOME/.cache/snapcraft/stage-packages"

      - name: Import GPG key
        if: matrix.goos == 'linux'
        run: |
          GPG_KEY_FILE=/tmp/signing-key.gpg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > "${GPG_KEY_FILE}"
          
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          GPG_FINGERPRINT=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{sub(/.*\//, "", $2); print $2; exit}')
          
          echo "GPG_FINGERPRINT=${GPG_FINGERPRINT}" >>"${GITHUB_ENV}"
          echo "GPG_KEY_FILE=${GPG_KEY_FILE}" >> "${GITHUB_ENV}"
        env:
          GPG_TTY: /dev/ttys000  # Set the GPG_TTY to avoid issues with pinentry

      - name: Run GoReleaser (Build)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          distribution: goreleaser-pro
          args: release --split --clean --timeout=60m
        env:
          # Note: the GPG_FINGERPRINT and GPG_KEY_FILE are defined in the task above. If they are not set,
          # goreleaser won't sign the packages.
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          # This causes version.IsOfficialBuild to return true when someone is
          # running one of our official release builds.
          BUILD_OPENTOFU_OFFICIAL: '1'
          RELEASE_FLAG_LATEST: ${{ needs.info.outputs.latest }}
          RELEASE_FLAG_PRERELEASE: ${{ needs.info.outputs.prerelease }}

  release:
    needs: [info, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: "github" }
          - { channel: "snapcraft" }
          - { channel: "docker" }
          - { channel: "packagecloud" }

    runs-on: "ubuntu-latest"
    #TODO runs-on: larger-runners
    name: "Release ${{ matrix.channel }}"

    environment: gpg
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.info.outputs.tag }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "linux", goarch: "amd64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "linux", goarch: "arm64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "freebsd", goarch: "amd64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "opensd", goarch: "amd64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "solaris", goarch: "amd64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "darwin", goarch: "amd64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "darwin", goarch: "arm64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "windows", goarch: "amd64", tag: "${{ needs.info.outputs.tag }}"}
      - name: Cache
        uses: ./.github/actions/release-cache
        with: { goos: "windows", goarch: "arm64", tag: "${{ needs.info.outputs.tag }}"}

      - name: Set up QEMU cross build support
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      

      - name: Login to Github Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v2.4.3

      - name: Setup snapcraft
        run: |
          sudo snap install snapcraft --classic --channel=7.x/stable

          # See https://github.com/goreleaser/goreleaser/issues/1715
          # https://bugs.launchpad.net/snapcraft/+bug/1889741
          mkdir -p "$HOME/.cache/snapcraft/download"
          mkdir -p "$HOME/.cache/snapcraft/stage-packages"

      - name: Import GPG key
        run: |
          GPG_KEY_FILE=/tmp/signing-key.gpg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode > "${GPG_KEY_FILE}"
          
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          GPG_FINGERPRINT=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{sub(/.*\//, "", $2); print $2; exit}')
          
          echo "GPG_FINGERPRINT=${GPG_FINGERPRINT}" >>"${GITHUB_ENV}"
          echo "GPG_KEY_FILE=${GPG_KEY_FILE}" >> "${GITHUB_ENV}"
        env:
          GPG_TTY: /dev/ttys000  # Set the GPG_TTY to avoid issues with pinentry

      - name: Run GoReleaser
        if: ${{ matrix.channel != 'packagecloud' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          distribution: goreleaser-pro
          args: continue --merge --timeout=60m
        env:
          # Note: the GPG_FINGERPRINT and GPG_KEY_FILE are defined in the task above. If they are not set,
          # goreleaser won't sign the packages.
          CHANNEL: ${{ matrix.channel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_TOKEN }}
          RELEASE_FLAG_LATEST: ${{ needs.info.outputs.latest }}
          RELEASE_FLAG_PRERELEASE: ${{ needs.info.outputs.prerelease }}

      - name: Upload Debian packages to PackageCloud
        if: ${{ matrix.channel == 'packagecloud' && !needs.info.outputs.prerelease && false}}
        uses: computology/packagecloud-github-action@3a3116159414e57767827ed264a6de29a1f86d4c # v0.6
        with:
                PACKAGE-NAME: dist/*.deb
                PACKAGECLOUD-USERNAME: opentofu
                PACKAGECLOUD-REPONAME: tofu
                PACKAGECLOUD-DISTRO: any/any
                PACKAGECLOUD-TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
      - name: Upload RPM packages to PackageCloud
        if: ${{ matrix.channel == 'packagecloud' && !needs.info.outputs.prerelease && false}}
        uses: computology/packagecloud-github-action@3a3116159414e57767827ed264a6de29a1f86d4c # v0.6
        with:
                PACKAGE-NAME: dist/*.rpm
                PACKAGECLOUD-USERNAME: opentofu
                PACKAGECLOUD-REPONAME: tofu
                PACKAGECLOUD-DISTRO: rpm_any/rpm_any
                PACKAGECLOUD-TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

